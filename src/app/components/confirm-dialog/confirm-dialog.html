<div class="dialog-box">
  <h2 id="confirm-title" class="h3">{{ data.title }}</h2>
  <p id="confirm-message">{{ data.message }}</p>
  <div class="d-flex flex-wrap justify-content-end gap-2 mt-4">
    <button id="confirm-cancel" type="button" class="btn btn-outline-primary" (click)="dialogRef.close(false)">
      Cancel
    </button>
    <button type="button" class="btn btn-danger" (click)="dialogRef.close(true)">
      {{ data.confirmText }}
    </button>
  </div>
</div>
