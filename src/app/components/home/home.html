<div class="container">
  <div class="p-5 mb-4 bg-light rounded-3">
    <h1 class="display-5">Discover London's blue plaques</h1>
    <p class="lead">
      3,375 plaques marking where famous people lived and worked.
      Browse them, find ones near you, and share your visits.
    </p>
    <a routerLink="/plaques" class="btn btn-primary btn-lg me-2">Browse plaques</a>
    <button class="btn btn-outline-primary btn-lg" (click)="surpriseMe()" [disabled]="loading">
      {{ loading ? 'Finding one...' : 'Surprise me' }}
    </button>
  </div>

  @if (randomPlaque) {
    <div class="card">
      <div class="card-body">
        <h2 class="h5">
          <a [routerLink]="['/plaques', randomPlaque._id]">{{ randomPlaque.title }}</a>
        </h2>
        <p class="mb-1">{{ randomPlaque.inscription | slice:0:200 }}...</p>
        <small class="text-muted">{{ randomPlaque.borough }}</small>
      </div>
    </div>
  }
</div>
