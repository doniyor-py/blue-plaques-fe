<div class="container">
  <div class="d-flex flex-wrap gap-2">
    <a routerLink="/nearby" class="btn btn-primary btn-lg">Find plaques near me</a>
    <a routerLink="/plaques" class="btn btn-outline-primary btn-lg">Browse plaques</a>
    <button class="btn btn-outline-primary btn-lg" (click)="surpriseMe()" [disabled]="loading">
      {{ loading ? 'Finding one...' : 'Surprise me' }}
    </button>
  </div>

  @if (randomPlaque) {
    <div class="card">
      <div class="card-body">
        <h2 class="h5">
          <a [routerLink]="['/plaques', randomPlaque._id]">{{ randomPlaque.title }}</a>
        </h2>
        <p class="mb-1">{{ randomPlaque.inscription | slice:0:200 }}...</p>
        <small class="text-muted">{{ randomPlaque.borough }}</small>
      </div>
    </div>
  }
</div>
