<nav class="navbar navbar-expand-sm bg-primary navbar-dark mb-4">
  <div class="container">
    <a class="navbar-brand" routerLink="/">Blue Plaques Explorer</a>
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" routerLink="/" routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: true }">Home</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/plaques" routerLinkActive="active">Plaques</a>
      </li>
      @if (authService.isLoggedIn()) {
        <li class="nav-item">
          <a class="nav-link" routerLink="/profile" routerLinkActive="active">My profile</a>
        </li>
      }
      @if (authService.isAdmin()) {
        <li class="nav-item">
          <a class="nav-link" routerLink="/admin/users" routerLinkActive="active">Users</a>
        </li>
      }
    </ul>
    <div class="ms-auto">
      @if (authService.isLoggedIn()) {
        <span class="navbar-text text-white me-2">Hi, {{ authService.getUsername() }}</span>
        <button class="btn btn-outline-light btn-sm" (click)="logout()">Log out</button>
      } @else {
        <a class="btn btn-outline-light btn-sm me-2" routerLink="/signup">Sign up</a>
        <a class="btn btn-light btn-sm" routerLink="/login">Log in</a>
      }
    </div>
  </div>
</nav>
