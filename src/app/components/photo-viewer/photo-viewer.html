<figure class="viewer">
  <img [src]="photo.url" [alt]="photo.caption || 'Photo of the plaque'">
  <figcaption id="photo-caption-text" class="text-white small mt-2">
    @if (photo.caption) { {{ photo.caption }} · }<span class="opacity-75">by {{ photo.username }}</span>
  </figcaption>
</figure>
<button id="photo-close" type="button" class="btn btn-light viewer-close"
        (click)="dialogRef.close()" aria-label="Close photo">&times;</button>
