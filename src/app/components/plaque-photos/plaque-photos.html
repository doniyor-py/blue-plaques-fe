<section class="mt-4" aria-labelledby="photos-heading">
  <h2 id="photos-heading" class="h4">Photos ({{ photos.length }})</h2>

  @if (message) { <div class="alert alert-success" role="status">{{ message }}</div> }
  @if (error) { <div class="alert alert-danger" role="alert">{{ error }}</div> }

  <div class="row row-cols-2 row-cols-md-3 g-3 mb-3">
    @for (photo of photos; track photo._id) {
      <div class="col">
        <figure class="mb-0">
          <button type="button" class="photo-thumb" (click)="showPhoto(photo)"
                  [attr.aria-label]="'Open photo' + (photo.caption ? ': ' + photo.caption : '')">
            <img [src]="photo.thumb_url || photo.url" [alt]="photo.caption || 'Photo of the plaque'"
                 loading="lazy" width="480" height="360">
          </button>
          <figcaption class="small mt-1">
            @if (photo.caption) { <span class="d-block">{{ photo.caption }}</span> }
            <span class="text-muted">by {{ photo.username }} · {{ photo.uploaded }}</span>
            @if (canDelete(photo)) {
              <button type="button" class="btn btn-link btn-sm text-danger p-0 ms-2 align-baseline"
                      (click)="deletePhoto(photo)" [attr.aria-label]="'Delete photo by ' + photo.username">Delete</button>
            }
          </figcaption>
        </figure>
      </div>
    } @empty {
      <div class="col-12 text-muted">No photos yet.</div>
    }
  </div>

  @if (authService.isLoggedIn()) {
    <div class="card card-body">
      <h3 class="h6">Add a photo</h3>
      <div class="row g-3">
        <div class="col-md-6">
          <label for="photo-file" class="form-label small">Photo (JPG, PNG or WEBP, up to 5 MB)</label>
          <input #fileInput id="photo-file" type="file" class="form-control"
                 accept="image/jpeg,image/png,image/webp" (change)="onFileChosen($event)">
        </div>
        <div class="col-md-6">
          <label for="photo-caption" class="form-label small">Caption (optional)</label>
          <input id="photo-caption" type="text" class="form-control" maxlength="200"
                 [value]="caption" (input)="caption = $any($event.target).value">
        </div>
      </div>
      @if (previewUrl) {
        <img [src]="previewUrl" alt="Preview of the chosen photo" class="preview mt-3">
      }
      <div class="mt-3">
        <button type="button" class="btn btn-primary" [disabled]="!selectedFile || uploading"
                (click)="upload(fileInput)">
          {{ uploading ? 'Uploading...' : 'Upload photo' }}
        </button>
      </div>
    </div>
  } @else {
    <p class="text-muted">
      <a routerLink="/login" [queryParams]="{ returnUrl: '/plaques/' + plaqueId }">Log in</a> to add a photo.
    </p>
  }

  <!-- full-size photo -->
  @if (openPhoto) {
    <div class="lightbox" role="dialog" aria-modal="true" aria-label="Photo, full size"
         (click)="onBackdropClick($event)" (keydown.escape)="closePhoto()">
      <figure class="lightbox-inner">
        <img [src]="openPhoto.url" [alt]="openPhoto.caption || 'Photo of the plaque'">
        <figcaption class="text-white small mt-2">
          {{ openPhoto.caption }}<span class="opacity-75"> · by {{ openPhoto.username }}</span>
        </figcaption>
      </figure>
      <button id="lightbox-close" type="button" class="btn btn-light lightbox-close"
              (click)="closePhoto()" aria-label="Close photo">&times;</button>
    </div>
  }
</section>
